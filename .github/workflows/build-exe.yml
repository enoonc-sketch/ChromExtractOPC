name: Build EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (gate)
        run: |
          python -m unittest discover -s tests -v

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --console --noupx --name ChromExtractOPC --icon assets\app.ico --add-data "assets\app.ico;assets" --collect-all asyncua --hidden-import tkinter --hidden-import demo_data --hidden-import web_settings --hidden-import config_tools --hidden-import alerts --hidden-import nettest --hidden-import stability --hidden-import probes --hidden-import drivercheck --hidden-import envwatch --hidden-import bgrun --hidden-import winservice --collect-submodules serial server_app.py

      - name: Code signing (only when secrets are set)
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File sign.ps1 -Check
          if ($LASTEXITCODE -eq 0) {
            powershell -NoProfile -ExecutionPolicy Bypass -File sign.ps1 dist\ChromExtractOPC.exe
            if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          }
          $global:LASTEXITCODE = 0

      - name: Check EXE exists
        run: |
          if (-not (Test-Path dist\ChromExtractOPC.exe)) { throw "dist\ChromExtractOPC.exe was not produced" }

      - name: Self test (real server + client + settings page)
        run: |
          dist\ChromExtractOPC.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          dist\ChromExtractOPC.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "--selftest failed" }

      - name: Collect deliverables
        run: |
          Copy-Item config.json dist\
          $files = "安装.bat","卸载.bat","启动服务.bat","启动图形界面.bat","安装开机自启.bat","install_autostart.ps1","设置防火墙.bat","安全管理.bat","打开设置页面.bat","后台启动.bat","停止后台服务.bat","安装为Windows服务.bat","卸载Windows服务.bat","使用说明_OPCUA.md","安全检查报告.md"
          foreach ($f in $files) { if (Test-Path $f) { Copy-Item $f dist\ } else { throw "missing $f" } }
          (Get-FileHash dist\ChromExtractOPC.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist\ChromExtractOPC.exe.sha256

      - name: Build installer (Inno Setup)
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          choco install innosetup -y --no-progress
          $ver = (dist\ChromExtractOPC.exe --version).Split(" ")[1]
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $isccArgs = @("/Qp", "/DMyAppVersion=$ver")
          powershell -NoProfile -ExecutionPolicy Bypass -File sign.ps1 -Check
          if ($LASTEXITCODE -eq 0) {
            $sp = (Resolve-Path sign.ps1).Path
            $isccArgs += @("/DSIGN", "/Ssigntool=powershell.exe -NoProfile -ExecutionPolicy Bypass -File `$q$sp`$q `$f")
          }
          & $iscc @isccArgs installer\ChromExtractOPC.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist-installer\*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File -Encoding ascii ($_.FullName + ".sha256") }

      - name: Silent install / uninstall test
        run: |
          $setup = (Get-ChildItem dist-installer\*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=autostart,autostart\service","/DIR=C:\ChromExtractOPC","/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "install failed $($p.ExitCode)" }
          if (-not (Test-Path C:\ChromExtractOPC\ChromExtractOPC.exe)) { throw "exe not installed" }
          $svc = Get-Service -Name ChromExtractOPC -ErrorAction SilentlyContinue
          if (-not $svc) { Get-Content install.log; throw "windows service not registered" }
          $svc.WaitForStatus('Running', '00:01:00')
          if ((Get-CimInstance Win32_Service -Filter "Name='ChromExtractOPC'").StartMode -ne 'Auto') { throw "service not auto start" }
          C:\ChromExtractOPC\ChromExtractOPC.exe --status
          if ($LASTEXITCODE -ne 0) { Get-Content C:\ChromExtractOPC\logs\server.log -Tail 50; throw "--status reports not running" }
          Stop-Service ChromExtractOPC
          (Get-Service ChromExtractOPC).WaitForStatus('Stopped', '00:01:00')
          Start-Service ChromExtractOPC
          (Get-Service ChromExtractOPC).WaitForStatus('Running', '00:01:00')
          $p = Start-Process C:\ChromExtractOPC\unins000.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed" }
          Start-Sleep 3
          if (Get-ScheduledTask -TaskName ChromExtractOPC -ErrorAction SilentlyContinue) { throw "task not removed" }
          if (Get-Service -Name ChromExtractOPC -ErrorAction SilentlyContinue) { throw "service not removed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ChromExtractOPC-Setup
          path: dist-installer/

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChromExtractOPC-Windows
          path: dist/
